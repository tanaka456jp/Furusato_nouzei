name: Workbook checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      excel:
        description: Run on a dedicated self-hosted Windows Excel runner
        type: boolean
        default: false

permissions:
  contents: read

# Cancel old queued Excel jobs when the PR's explicit opt-in is removed.
concurrency:
  group: furusato-workbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5 pymupdf==1.26.4
      - run: |
          python tools/audit_pdf_layout.py --self-test
          python tools/test_display_contract.py
          python tools/verify_baseline.py
          python tools/test_catalog_sync.py
          python tools/test_file_picker_filter.py
          python tools/qa_contract.py workbook/baseline.xlsx
          python tools/report_formula_wiring.py
          python tools/test_workbook.py
          python tools/test_salary_donation_oracle.py
          python tools/test_mortgage_filing.py
          python tools/test_insurance_deductions.py
          python tools/test_reconcile_salary_only_from_slip.py
          python tools/test_prior_year_projection.py
          python tools/test_collect_local_release_evidence.py
          python tools/test_release_display_matrix.py
          python tools/test_release_readiness.py
          python tools/test_excel_release_candidate.py
          python tools/test_prepare_official_excel_release.py
          python tools/test_signed_release_negative.py
          python tools/test_distribution_integrity.py
          python tools/test_package_ready_to_use_review.py
          python tools/release_readiness.py --head "${{ github.event.pull_request.head.sha || github.sha }}" --output release_readiness_hold.json
          python tools/verify_separate_oracle.py
          node tools/test_excel_gas_v4183.cjs
          python tools/build_workbook.py Furusato_nouzei_audit.xlsx
          python tools/audit_tax_tables.py workbook/baseline.xlsx Furusato_nouzei_audit.xlsx
          python tools/audit_statutory_tables.py workbook/baseline.xlsx
          python tools/audit_statutory_tables.py Furusato_nouzei_audit.xlsx
          python tools/package_review.py Furusato_nouzei_v4_REVIEW.zip
          python tools/test_setup_contract.py Furusato_nouzei_v4_REVIEW.zip
          python tools/test_shared_runner_contract.py
          python tools/test_open_probe_launcher.py
          python tools/test_vbaupdater_bridge.py
          python tools/test_withholding_reader.py
          python tools/make_excel_open_probes.py Excel_open_probes --self-test
      - name: Parse shared-PC Windows PowerShell setup (static syntax)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = (Resolve-Path ./tools/register_shared_pc_runner.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Out-String)
          }
      - name: Parse local signed-release verifier (syntax only)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = (Resolve-Path ./tools/verify_signed_release_local.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Parse consent-gated local physical printer verifier (syntax only)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = (Resolve-Path ./tools/verify_physical_printer_local.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify local physical printer operation is blocked under CI
        shell: pwsh
        run: |
          $env:CI = 'true'
          $expected = 'PHYSICAL_PRINT_REQUIRES_LOCAL_INTERACTIVE_OPERATOR'
          try {
            & ./tools/verify_physical_printer_local.ps1 `
              -Workbook '__FURUSATO_NONEXISTENT_SYNTHETIC__.xlsm' `
              -ExpectedWorkbookSha256 ('a' * 64) `
              -ExpectedDisplayedLimitYen 109000 `
              -ExpectedTaxYear 2026 `
              -PrinterName '__NO_REAL_PRINTER__' `
              -EvidencePath '__DO_NOT_CREATE_PRINTER_EVIDENCE__.json' `
              -SyntheticDataReviewed -AllowOnePagePrint
            throw 'UNSAFE_CI_PRINT_VERIFIER_SUCCEEDED'
          } catch {
            if ($_.Exception.Message -cne $expected) { throw }
          }
          if (Test-Path '__DO_NOT_CREATE_PRINTER_EVIDENCE__.json') {
            throw 'PRINTER_CI_BLOCK_CREATED_AN_EVIDENCE_FILE'
          }
      - name: Attach one-click diagnostic launcher
        run: |
          cp tools/START_EXCEL_PROBE.cmd tools/run_excel_open_probe.ps1 tools/probe_excel_open.ps1 Excel_open_probes/
      - name: Upload XLSX opening diagnostics (not production)
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_nouzei_ExcelOpen_PROBES
          path: Excel_open_probes/
          if-no-files-found: error
          retention-days: 7
      - name: Attach release readiness HOLD matrix (metadata only)
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_RELEASE_READINESS_HOLD
          path: release_readiness_hold.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload reproducible review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_nouzei_v4_REVIEW
          path: Furusato_nouzei_v4_REVIEW.zip
          if-no-files-found: error
          retention-days: 14

  # Runs for every PR on GitHub-hosted Windows (free for this public repo).
  # Microsoft Excel desktop is not installed here; COM/VBA execution is separate.
  windows_compat:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook test dependency
        shell: powershell
        run: |
          python -m pip install openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
      - name: Parse 41-case Excel/GAS PowerShell using native Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path .\tools\run_excel_gas_41_v4183.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile(
             $script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ('Excel/GAS parity script parser errors: '+($errors | Out-String))
          }
      - name: Parse desktop evidence collector in native Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\tools\probe_display_layout.ps1).Path,
            [ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Rebuild workbook and review ZIP on Windows
        shell: powershell
        run: |
          python tools/verify_baseline.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen baseline differs' }
          python tools/test_catalog_sync.py
          if ($LASTEXITCODE -ne 0) { throw 'Approved tax-master revision mismatch' }
          python tools/test_file_picker_filter.py
          if ($LASTEXITCODE -ne 0) { throw 'PDF filter contract mismatch' }
          python tools/test_workbook.py
          python tools/test_salary_donation_oracle.py
          python tools/test_mortgage_filing.py
          python tools/test_insurance_deductions.py
          python tools/test_reconcile_salary_only_from_slip.py
          python tools/test_prior_year_projection.py
          python tools/test_collect_local_release_evidence.py
          python tools/test_release_display_matrix.py
          python tools/verify_separate_oracle.py
          if ($LASTEXITCODE -ne 0) { throw 'Workbook static regression failed' }
          node tools/test_excel_gas_v4183.cjs
          if ($LASTEXITCODE -ne 0) { throw '41-case parity comparator contract failed' }
          python tools/audit_statutory_tables.py workbook/baseline.xlsx
          if ($LASTEXITCODE -ne 0) { throw 'Baseline statutory reference audit failed' }
          python tools/build_workbook.py statutory_review.xlsx
          if ($LASTEXITCODE -ne 0) { throw 'Review build for statutory audit failed' }
          python tools/audit_statutory_tables.py statutory_review.xlsx
          if ($LASTEXITCODE -ne 0) { throw 'Generated statutory reference audit failed' }
          python tools/package_review.py Furusato_nouzei_v4_REVIEW.zip
          if ($LASTEXITCODE -ne 0) { throw 'Review ZIP packaging failed' }
          python tools/test_setup_contract.py Furusato_nouzei_v4_REVIEW.zip
          if ($LASTEXITCODE -ne 0) { throw 'Package or installer contract failed' }
          python tools/make_excel_open_probes.py Excel_open_probes --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Excel opening diagnostic contract failed' }
          python tools/test_open_probe_launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'One-click Excel launcher contract failed' }
          python tools/test_vbaupdater_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'VBAUpdater sandbox staging contract failed' }
          python tools/test_withholding_reader.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline withholding reader test failed' }
      - name: Reject synthetic unsigned VBA in native Windows PowerShell 5.1
        shell: powershell
        run: |
          python tools/test_signed_release_negative.py
          if ($LASTEXITCODE -ne 0) { throw 'Native unsigned-VBA release guard regression' }
      - name: Verify native PowerShell 5.1 and Japanese-path extraction
        shell: powershell
        run: |
          & .\tools\verify_windows_hosted.ps1 -Package Furusato_nouzei_v4_REVIEW.zip
          if (-not $?) { throw 'Windows-hosted acceptance failed' }
      - name: Record clear separation from Excel COM acceptance
        shell: powershell
        run: |
          "GitHub-hosted Windows compatibility: PASS if all prior steps passed." >> $env:GITHUB_STEP_SUMMARY
          "Excel desktop, macros, tax-law update, printed output and real-case comparisons: NOT TESTED by this job." >> $env:GITHUB_STEP_SUMMARY

  document_reader:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build offline reader executable for end-user PDFs
        shell: powershell
        run: |
          python -m pip install pyinstaller==6.16.0 pymupdf==1.26.7 pillow pytesseract pillow-heif openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Offline reader build dependencies unavailable' }
          python tools/test_withholding_reader.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline parser contract failed' }
          python -m PyInstaller --onefile --clean --noconfirm --name FurusatoDocumentReader tools/withholding_reader.py
          if ($LASTEXITCODE -ne 0) { throw 'Reader executable build failed' }
          $temp = Join-Path $env:RUNNER_TEMP ('furusato_reader_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp | Out-Null
          try {
            $csv = Join-Path $temp 'synthetic.csv'
            @('field,value','year,2026','salary_gross,7000000','social_insurance,1000000','income_tax_withheld,0') | Set-Content -LiteralPath $csv -Encoding Ascii
            $out = Join-Path $temp 'result.json'
            $bridge = Join-Path $temp 'bridge.tsv'
            & .\dist\FurusatoDocumentReader.exe --input $csv --output $out --bridge $bridge
            if ($LASTEXITCODE -ne 0) { throw 'Reader executable failed synthetic CLI smoke' }
            $result = Get-Content -LiteralPath $out -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($result.status -ne 'READY_FOR_EXCEL_CROSSCHECK' -or $result.fields.salary_gross -ne 7000000) { throw 'Reader smoke wrong or incomplete' }
            if (-not (Test-Path -LiteralPath $bridge -PathType Leaf)) { throw 'Reader VBA bridge missing' }
            # Validate the packaged Windows EXE itself, not just Python:
            # two anonymous slips, page count only, explicit page 2.
            $multiPdf = Join-Path $temp 'synthetic-two-slips.pdf'
            $generatePdf = @'
          import fitz,sys
          doc=fitz.open()
          for salary in (5000000,7000000):
              page=doc.new_page()
              page.insert_text((40,30),"G04 "+format(salary,","))
              page.insert_text((40,55),"G08 0")
              page.insert_text((40,80),"G26 1,000,000")
              page.insert_text((40,120),"ANONYMOUS SYNTHETIC SAMPLE: PAGE SELECTION CHECK")
          doc.save(sys.argv[1])
          doc.close()
          '@
            $fixtureScript = Join-Path $temp 'create_synthetic_pdf.py'
            $generatePdf | Set-Content -LiteralPath $fixtureScript -Encoding Ascii
            python $fixtureScript $multiPdf
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create synthetic multi-page PDF fixture' }
            $pageCountOutput = Join-Path $temp 'count.txt'
            & .\dist\FurusatoDocumentReader.exe --input $multiPdf --output $pageCountOutput --page-count
            if ($LASTEXITCODE -ne 0) { throw 'Packaged reader page-count failed' }
            if ([string](Get-Content -LiteralPath $pageCountOutput -Raw -Encoding Ascii).Trim() -ne '2') {
              throw 'Packaged reader reported incorrect PDF page count'
            }
            $singleOut = Join-Path $temp 'selected-result.json'
            $singleBridge = Join-Path $temp 'selected-bridge.tsv'
            & .\dist\FurusatoDocumentReader.exe --input $multiPdf --output $singleOut --bridge $singleBridge --page 2
            if ($LASTEXITCODE -ne 0) { throw 'Packaged reader explicit PDF page selection failed' }
            $selected = Get-Content -LiteralPath $singleOut -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($selected.status -ne 'REQUIRES_REVIEW' -or $selected.format -ne 'PDF_PAGE_SELECTED' -or
                $selected.fields.salary_gross -ne 7000000 -or
                -not ($selected.warnings -contains 'MULTIPAGE_SELECTED_PAGE_REVIEW')) {
              throw 'Packaged reader selected page does not enforce verification or returned incorrect values'
            }
            if (-not ((Get-Content -LiteralPath $singleBridge -Raw -Encoding Ascii) -match 'salary_gross\s+7000000')) {
              throw 'Selected-page bridge did not use the second synthetic slip'
            }
          } finally {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
      - name: Assemble Python-free Windows review ZIP
        shell: powershell
        run: |
          python tools/package_review.py Furusato_nouzei_Windows_REVIEW.zip dist/FurusatoDocumentReader.exe
          if ($LASTEXITCODE -ne 0) { throw 'Python-free package assembly failed' }
          python tools/test_windows_package.py Furusato_nouzei_Windows_REVIEW.zip
          if ($LASTEXITCODE -ne 0) { throw 'Windows distribution contract failed' }
          python tools/verify_distribution_integrity.py Furusato_nouzei_Windows_REVIEW.zip --output distribution_integrity_hold.json
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe or inconsistent Windows ZIP: HOLD' }
          # Detect signer trust separately from archive byte integrity.
          # Unsigned PyInstaller EXE is expected in review builds. A valid
          # EXE signature alone does not authorize distributing the ZIP.
          $sig = Get-AuthenticodeSignature -LiteralPath .\dist\FurusatoDocumentReader.exe
          $signatureStatus = if ($null -ne $sig -and $sig.Status -eq 'Valid') {
            'EXE_TRUSTED_SIGNER_REVIEW_ONLY'
          } else { 'EXE_UNSIGNED_OR_UNTRUSTED_HOLD' }
          $review = [ordered]@{
            schema = 'furusato-windows-signature-inspection/v1'
            release_decision = 'HOLD'
            exe_authenticode_inspection = $signatureStatus
            exe_sha256 = (Get-FileHash -LiteralPath .\dist\FurusatoDocumentReader.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            signed_archive_or_detached_signature = 'NOT_VERIFIED'
            limitation = 'A signed EXE alone does not sign this ZIP or approve public distribution'
          }
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path 'distribution_signature_hold.json'),
            ($review | ConvertTo-Json -Depth 4),[Text.UTF8Encoding]::new($false))
      - name: Upload distribution integrity and unsigned/release HOLD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_DISTRIBUTION_INTEGRITY_HOLD_${{ github.run_id }}
          path: |
            distribution_integrity_hold.json
            distribution_signature_hold.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Python-free Windows review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_nouzei_Windows_REVIEW_${{ github.run_id }}
          path: Furusato_nouzei_Windows_REVIEW.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone local PDF reader
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_DocumentReader_Windows_EXE_${{ github.run_id }}
          path: dist/FurusatoDocumentReader.exe
          if-no-files-found: error
          retention-days: 14

  # Explicit opt-in: never execute arbitrary fork PR code on a self-hosted runner.
  excel:
    # Run expensive PC Excel COM only after lightweight safety gates have passed.
    needs: [static, windows_compat, document_reader]
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.body, '[run-windows-excel]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.excel)
    # Both PC1 and PC2 may host this repository-scoped runner alongside
    # their existing runners. Accept only the Furusato Excel runner label.
    # Normally start PC1; start PC2 when PC1 is unavailable.
    runs-on: [self-hosted, Windows, furusato-excel]
    concurrency:
      group: furusato-excel-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Bound the two full COM acceptance passes, including exact split limits and staged VBA.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and verify stale-results safety (isolated Excel)
        shell: powershell
        run: |
          python -m pip install openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Python dependencies' }
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $work) { throw 'Acceptance directory already exists' }
          New-Item -ItemType Directory -Path $work | Out-Null
          $zip = Join-Path $work 'review.zip'
          python tools/package_review.py $zip
          if ($LASTEXITCODE -ne 0) { throw 'Review ZIP generation failed' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $work 'review')
          $probes = Join-Path $work 'excel_open_probes'
          python tools/make_excel_open_probes.py $probes --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Excel opening diagnostic preparation failed' }
          $probeEvidence = Join-Path $work 'excel_open_probe.json'
          powershell.exe -NoProfile -File .\tools\probe_excel_open.ps1 -ProbeDirectory $probes -EvidencePath $probeEvidence
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Excel opening diagnostic failed; installer verification continues.' }
          $setup = Join-Path $work 'review/setup.ps1'
          # The installer is already bounded by the Excel CI job timeout.
          # PowerShell 5.1 Start-Process returned a blank ExitCode even when
          # setup.log and the staged XLSM confirmed a successful build.
          # Use the previously accepted direct invocation; NEVER treat an
          # unverified file or an absent return code as a successful build.
          powershell.exe -NoProfile -File $setup
          $installerExitCode = $LASTEXITCODE
          Write-Host ('QA_INSTALLER_NATIVE_EXIT=' + [string]$installerExitCode)
          if ($null -eq $installerExitCode -or [int]$installerExitCode -ne 0) {
            throw ('Excel installer did not exit successfully (code=' + [string]$installerExitCode + '); see setup.log')
          }
          $reviewed = Join-Path $work 'review/Furusato_nouzei.xlsm'
          if (-not (Test-Path -LiteralPath $reviewed -PathType Leaf)) {
            throw 'Excel installer returned success without a generated XLSM'
          }
          # The fail-closed UI gate runs BEFORE the tax-master network update.
          # A blocked external catalog must not conceal stale-result failures.
          & .\tools\verify_stale_ui.ps1 -Workbook $reviewed
          if (-not $?) { throw 'Manual calculation stale-result gate failed' }
          'STALE_RESULTS_REAL_EXCEL_PASS (isolated synthetic).' >> $env:GITHUB_STEP_SUMMARY
      - name: Complete Excel functional and tax update acceptance
        if: success()
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $evidence = Join-Path $work 'excel_acceptance.json'
          & .\tools\verify_excel.ps1 -Workbook (Join-Path $work 'review/Furusato_nouzei.xlsm') -EvidencePath $evidence -PdfEvidencePath (Join-Path $work 'pdf_layout_evidence')
          if (-not $?) { throw 'Windows Excel acceptance failed' }
          if (-not (Test-Path -LiteralPath $evidence)) { throw 'Excel acceptance evidence was not created' }
          $report = Get-Content -LiteralPath $evidence -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'Excel acceptance report is not PASS' }
          if (-not $report.workbook_sha256) { throw 'Excel acceptance report lacks workbook SHA-256' }
          $actual = (Get-FileHash -LiteralPath (Join-Path $work 'review/Furusato_nouzei.xlsm') -Algorithm SHA256).Hash
          if ($report.workbook_sha256 -ne $actual) { throw 'Excel acceptance evidence does not match generated workbook SHA-256' }
      - name: Capture isolated desktop Excel window and observed DPI
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $folder = Join-Path $work 'display_review'
          & .\tools\probe_display_layout.ps1 -Workbook (Join-Path $work 'review/Furusato_nouzei.xlsm') -EvidenceDirectory $folder
          if (-not $?) { throw 'Display evidence collector failed its isolation guard' }
          $file = Join-Path $folder 'display_review.json'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Missing display observation evidence' }
          $result = Get-Content -LiteralPath $file -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.schema -ne 'furusato-display-review/v1' -or $result.release_approved -ne $false -or
              $result.status -notin @('UNVERIFIED','CAPTURED_REQUIRES_VISUAL_REVIEW')) {
            throw 'Display observation misrepresented as release acceptance'
          }
          if ($result.status -ne 'CAPTURED_REQUIRES_VISUAL_REVIEW') {
            throw ('PC Excel worksheet capture missing: ' + [string]$result.failure_category + '; release/display HOLD')
          }
          if ($result.screenshot -and -not (Test-Path -LiteralPath (Join-Path $folder $result.screenshot))) {
            throw 'Display evidence names a missing image'
          }
          if ($result.status -eq 'CAPTURED_REQUIRES_VISUAL_REVIEW' -and
              @($result.screenshots).Count -ne 3) {
            throw 'All three worksheet regions must be captured before visual review'
          }
          foreach ($imageName in @($result.screenshots)) {
            if ($imageName -and -not (Test-Path -LiteralPath (Join-Path $folder $imageName))) {
              throw 'Display evidence names a missing worksheet region'
            }
          }
          if ($result.display_observation.physical_resolution_verified -eq $true -or
              $result.observation_requires_manual_visual_review -ne $true) {
            throw 'Display-mode observation must never certify human visual acceptance'
          }
          if ($result.display_observation.display_mode_observed -eq $true) {
            if ($result.display_observation.display_mode_source -ne 'EnumDisplaySettingsW' -or
                @($result.display_observation.current_mode_pixels).Count -ne 2) {
              throw 'Observed Windows output display mode is incomplete'
            }
          }
          ('Desktop display observation: '+$result.status+
             '; current Windows display mode '+$result.scenario_observed_not_certified+
             '; manual visual sign-off and remaining scenarios still HOLD.') >> $env:GITHUB_STEP_SUMMARY
      - name: Upload isolated Excel display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_nouzei_DISPLAY_REVIEW_${{ github.run_id }}
          path: ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/display_review/
          if-no-files-found: ignore
          retention-days: 7
      # VBAUpdater read-only and real sandbox project-push are mandatory release
      # gates. The sandbox source is intentionally modified by one ASCII comment
      # to prove a real write; no customer or distributed workbook is changed.
      - name: Verify synthetic Excel PDF layout and render evidence
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pymupdf==1.26.4
          if ($LASTEXITCODE -ne 0) { throw 'PDF audit renderer install failed: HOLD' }
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          python tools/audit_pdf_layout.py --folder (Join-Path $work 'pdf_layout_evidence') --source tools/build_workbook.py
          if ($LASTEXITCODE -ne 0) { throw 'PDF layout audit failed: HOLD' }
          'Synthetic Excel A4 PDF layout: PASS. Physical printer and real desktop screen: HOLD.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload synthetic PDF visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_nouzei_PDF_LAYOUT_REVIEW_${{ github.run_id }}
          path: ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/pdf_layout_evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: VBAUpdater isolated read-only preflight and diff
        if: success()
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $reviewed = Join-Path $work 'review/Furusato_nouzei.xlsm'
          $evidence = Join-Path $work 'excel_acceptance.json'
          if (-not (Test-Path -LiteralPath $evidence)) { throw 'Excel acceptance evidence not found' }
          $accepted = Get-Content -LiteralPath $evidence -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($accepted.status -ne 'PASS') { throw 'VBAUpdater preflight must follow Excel acceptance PASS' }
          $bridgeEvidence = Join-Path $work 'vbaupdater_bridge.json'
          & .\tools\verify_vbaupdater_bridge.ps1 -Workbook $reviewed -StagingRoot (Join-Path $work 'vbaupdater_readonly') -EvidencePath $bridgeEvidence
          if (-not $?) { throw 'VBAUpdater read-only verification failed' }
          $bridge = Get-Content -LiteralPath $bridgeEvidence -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $bridge.original_preserved -or $bridge.status -ne 'READONLY_PREFLIGHT_DIFF_PASS') {
            throw 'VBAUpdater read-only preflight and diff did not pass'
          }
          ('VBAUpdater read-only preflight: ' + $bridge.status + '.') >> $env:GITHUB_STEP_SUMMARY
      - name: VBAUpdater staged project-push (mandatory acceptance)
        id: staged_push
        if: success()
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $reviewed = Join-Path $work 'review/Furusato_nouzei.xlsm'
          $pushEvidence = Join-Path $work 'vbaupdater_push.json'
          & .\tools\verify_vbaupdater_bridge.ps1 -Workbook $reviewed -StagingRoot (Join-Path $work 'vbaupdater_push') -EvidencePath $pushEvidence -PushInSandbox
          if (-not $?) { throw 'Mandatory disposable VBAUpdater project-push failed' }
          $push = Get-Content -LiteralPath $pushEvidence -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $push.original_preserved -or
              $push.status -ne 'STAGED_PUSH_EXCEL_PASS' -or
              $push.project_push -ne 'PASS' -or
              $push.post_push_diff -ne 'PASS' -or
              $push.post_push_excel -ne 'PASS' -or
              $push.synthetic_source_delta -ne 'MARKER_COMMENT_IN_STAGE_ONLY' -or
              -not $push.synthetic_source_verified) {
            throw 'Mandatory VBAUpdater module write, post-diff and Excel acceptance incomplete'
          }
          ('Mandatory VBAUpdater staged project-push: ' + $push.status + '.') >> $env:GITHUB_STEP_SUMMARY
      - name: Report mandatory VBAUpdater staging failure
        if: failure() && steps.staged_push.outcome == 'failure'
        shell: powershell
        run: |
          "FAIL: VBAUpdater sandbox project-push is a mandatory acceptance gate. Product distribution is HOLD. Original workbook remains preserved. See staged push evidence." >> $env:GITHUB_STEP_SUMMARY
      - name: Checkout exact pinned GAS PR #2 tax engine (read-only)
        if: success()
        uses: actions/checkout@v4
        with:
          ref: 347aae5756b90c05a10b2ffe6123b0ce09e3fc01
          path: _gas_reference_v4183
          persist-credentials: false
      - name: Compare 41 synthetic cases in actual Excel vs pinned GAS engine
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $book = Join-Path $work 'review/Furusato_nouzei.xlsm'
          $acceptance = Get-Content -LiteralPath (Join-Path $work 'excel_acceptance.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath $book -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($acceptance.status -ne 'PASS' -or
              $acceptance.workbook_sha256.ToLowerInvariant() -cne $actual) {
            throw 'Previously accepted workbook does not match the workbook in parity test'
          }
          $reference = Join-Path $env:GITHUB_WORKSPACE '_gas_reference_v4183'
          $evidence = Join-Path $work 'excel_gas_41_observations.json'
          $comparison = Join-Path $work 'excel_gas_41_comparison.json'
          if ((Test-Path -LiteralPath $evidence) -or (Test-Path -LiteralPath $comparison)) {
            throw 'Synthetic parity outputs already exist'
          }
          & .\tools\run_excel_gas_41_v4183.ps1 -Workbook $book -GasCheckout $reference -OutputPath $evidence
          $jsonLines = @(& node .\tools\compare_excel_gas_v4183.cjs $evidence $reference 2>&1)
          $exitCode = $LASTEXITCODE
          $json = [string]::Join([Environment]::NewLine,[string[]]$jsonLines)
          [IO.File]::WriteAllText($comparison,$json,([System.Text.UTF8Encoding]::new($false)))
          if ($exitCode -ne 0) { throw ('41-case comparator failed: '+$json) }
          $report = $json | ConvertFrom-Json
          if ($report.releaseVerdict -cne 'HOLD' -or
              $report.numericVerdict -cne 'MATCH_41_OF_41' -or
              $report.matched -ne 41 -or $report.mismatchCount -ne 0 -or
              $report.calculationStateVerdict -cne 'DONE_41_OF_41' -or
              $report.excelCalculationDoneCount -ne 41 -or
              $report.excelCalculationPendingCount -ne 0 -or
              $report.actualExcelCOM -ne $true) {
            throw ('Excel vs GAS numerical discrepancy: '+$json)
          }
          $diag = Get-Content -LiteralPath $evidence -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $diag.calculationDiagnostics -or
              $diag.calculationDiagnostics.persistedToWorkbook -ne $false) {
            throw 'In-memory Excel calculation diagnostic is missing'
          }
          ('Excel calculation flag diagnostic: '+$diag.calculationDiagnostics.stateVerdict+
             '; initialForceFullCalculation='+$diag.calculationDiagnostics.initialForceFullCalculation) >> $env:GITHUB_STEP_SUMMARY
          (('Excel '+$report.excelRevision+' vs pinned GAS: ')+$report.matched+'/41 all 3 amounts match; '+
             $report.excelCalculationPendingCount+' xlPending; release=HOLD') >> $env:GITHUB_STEP_SUMMARY
      - name: Upload verified review XLSM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_nouzei_Excel_XLSM_REVIEW_${{ github.run_id }}
          path: |
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/review/Furusato_nouzei.xlsm
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_acceptance.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/vbaupdater_bridge.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/vbaupdater_push.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/vbaupdater_excel_acceptance.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_gas_41_observations.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_gas_41_comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furusato-windows-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/review/setup.log
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/review/_furusato_mask_qa.trace
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/review/setup_launcher.log
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_acceptance.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_open_probe.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/vbaupdater_bridge.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_gas_41_observations.json
            ${{ runner.temp }}/furusato-${{ github.run_id }}-${{ github.run_attempt }}/excel_gas_41_comparison.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean temporary acceptance data
        if: always()
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('furusato-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          # Only anonymous synthetic fixtures are created under this unique path.
          # Transient file locks on review.zip are not an Excel calculation failure.
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            if (-not (Test-Path -LiteralPath $work)) { break }
            try {
              Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction Stop
            } catch {
              if ($attempt -eq 12) {
                Write-Warning 'SYNTHETIC_TEMP_CLEANUP_INCOMPLETE: runner maintenance needed'
                'Synthetic runner temp cleanup incomplete; review human maintenance; Release is HOLD.' >> $env:GITHUB_STEP_SUMMARY
                break
              }
              Start-Sleep -Seconds 2
            }
          }
          if (-not (Test-Path -LiteralPath $work)) {
            'Isolated synthetic temporary Excel files removed.' >> $env:GITHUB_STEP_SUMMARY
          }

  # Create a user-testable ReadyToUse review bundle from EXACTLY the two
  # separately accepted artifacts of THIS Actions run. This is NOT a release.
  ready_to_use_review:
    # Do not create a review ZIP if static or Windows compatibility failed.
    needs: [static, windows_compat, excel, document_reader]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: Furusato_nouzei_Excel_XLSM_REVIEW_${{ github.run_id }}
          path: _review_excel
      - uses: actions/download-artifact@v4
        with:
          name: Furusato_DocumentReader_Windows_EXE_${{ github.run_id }}
          path: _review_reader
      - name: Bind accepted XLSM and reader from this exact run into review ZIP
        shell: powershell
        run: |
          $books = @(Get-ChildItem -LiteralPath _review_excel -Filter Furusato_nouzei.xlsm -Recurse -File)
          $acceptances = @(Get-ChildItem -LiteralPath _review_excel -Filter excel_acceptance.json -Recurse -File)
          $readers = @(Get-ChildItem -LiteralPath _review_reader -Filter FurusatoDocumentReader.exe -Recurse -File)
          if ($books.Count -ne 1 -or $acceptances.Count -ne 1 -or $readers.Count -ne 1) {
            throw 'Missing or ambiguous exact-run accepted artifacts'
          }
          python tools/test_package_ready_to_use_review.py
          if ($LASTEXITCODE -ne 0) { throw 'ReadyToUse bundle negative tests failed' }
          python tools/package_ready_to_use_review.py --book $books[0].FullName --reader $readers[0].FullName --acceptance $acceptances[0].FullName --guide docs/user-guide.md --target Furusato_nouzei_ReadyToUse_REVIEW_HOLD.zip --evidence ready_to_use_review_hold.json --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'ReadyToUse review ZIP failed exact acceptance/SHA check' }
          $report = Get-Content -LiteralPath ready_to_use_review_hold.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath Furusato_nouzei_ReadyToUse_REVIEW_HOLD.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($report.release_decision -ne 'HOLD' -or
              $report.package_class -ne 'SYNTHETIC_CI_REVIEW_ONLY' -or
              $report.ready_to_use_review_sha256 -cne $actual) {
            throw 'Review bundle must have exact hash and stay HOLD'
          }
          'ReadyToUse REVIEW ZIP assembled from exactly accepted same-run XLSM and reader; release=HOLD.' >> $env:GITHUB_STEP_SUMMARY
      - name: Record exact-head CI acceptance for the review package (NOT a release)
        shell: powershell
        run: |
          python tools/test_ci_acceptance_receipt.py
          if ($LASTEXITCODE -ne 0) { throw 'CI acceptance receipt negative tests failed' }
          python tools/record_ci_acceptance.py --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" --run-id "${{ github.run_id }}" --static "${{ needs.static.result }}" --windows-compat "${{ needs.windows_compat.result }}" --excel "${{ needs.excel.result }}" --document-reader "${{ needs.document_reader.result }}" --review ready_to_use_review_hold.json --archive Furusato_nouzei_ReadyToUse_REVIEW_HOLD.zip --output ci_exact_head_acceptance_hold.json
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head CI provenance / archive validation failed' }
      - name: Upload review-only ReadyToUse ZIP and anonymous SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_ReadyToUse_REVIEW_HOLD_${{ github.run_id }}
          path: |
            Furusato_nouzei_ReadyToUse_REVIEW_HOLD.zip
            ready_to_use_review_hold.json
            ci_exact_head_acceptance_hold.json
          if-no-files-found: error
          retention-days: 14
