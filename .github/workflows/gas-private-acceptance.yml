name: GAS private installation safety and browser acceptance
on:
  pull_request:
    paths: ['gas/**', '.github/workflows/gas-private-acceptance.yml']
  push:
    branches: [feature/gas-workflow-20261106]
    paths: ['gas/**', '.github/workflows/gas-private-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    # Match the OS supported by pinned Playwright instead of moving ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix gas --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --target gas/.qa-python pypdf==6.1.3
      - run: node gas/tests/test-deployment.cjs
      - run: node gas/tests/test-private-files.cjs
      - run: node gas/tests/test-clasp-files.cjs
      - run: node gas/tests/test-engine.cjs
      - run: node gas/tests/test-ocr.cjs
      - run: node gas/tests/test-contract.cjs
      - run: node gas/tests/test-browser.cjs
      - run: node gas/scripts/build-preview.cjs
      - run: node gas/tests/test-preview.cjs
      - run: npx --prefix gas playwright install --with-deps chromium
      - run: node gas/tests/test-browser-auth.cjs
      - run: node gas/tests/test-real-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GAS-synthetic-Chromium-${{ github.run_id }}
          path: gas/dist/acceptance/
          if-no-files-found: warn
          retention-days: 14
  windows-self-hosted:
    # Trusted owner branch push only. Never run fork/PR code on this runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'tanaka456jp/Furusato_nouzei' &&
      github.ref == 'refs/heads/feature/gas-workflow-20261106' &&
      github.actor == 'tanaka456jp'
    runs-on: [self-hosted, Windows, furusato-excel]
    concurrency:
      group: furusato-excel-device
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix gas --ignore-scripts --no-audit --no-fund
      - name: PowerShell offline preflight (no OAuth or Google writes)
        shell: powershell
        run: ./gas/scripts/setup-private-gas.ps1
      - name: Isolated PDF text checker dependency
        run: python -m pip install --target gas/.qa-python pypdf==6.1.3
      - run: node gas/tests/test-deployment.cjs
      - run: node gas/tests/test-clasp-files.cjs
      - run: node gas/tests/test-engine.cjs
      - run: node gas/tests/test-ocr.cjs
      - run: node gas/tests/test-browser.cjs
      - run: node gas/scripts/build-preview.cjs
      - name: Installed Edge real browser synthetic workflow and PDF
        env:
          FURUSATO_BROWSER_CHANNEL: msedge
        run: |
          node gas/tests/test-browser-auth.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Origin authorization boundary regression failed' }
          node gas/tests/test-real-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GAS-Windows-device-synthetic-${{ github.run_id }}
          path: gas/dist/acceptance/
          if-no-files-found: warn
          retention-days: 14
      - name: Acceptance boundary
        shell: powershell
        run: |
          'Windows device browser: synthetic only. Google OAuth/deploy/OCR and physical printing require separate private evidence. Release HOLD.' >> $env:GITHUB_STEP_SUMMARY
