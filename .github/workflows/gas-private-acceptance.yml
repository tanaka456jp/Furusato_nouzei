name: GAS private installation safety and browser acceptance
on:
  pull_request:
    paths: ['gas/**', '.github/workflows/gas-private-acceptance.yml']
  push:
    branches: [feature/gas-workflow-20261106]
    paths: ['gas/**', '.github/workflows/gas-private-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    # Match the OS supported by pinned Playwright instead of moving ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix gas --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --target gas/.qa-python pypdf==6.1.3
      - run: node gas/tests/test-deployment.cjs
      - run: node gas/tests/test-live-ocr-readiness.cjs
      - run: node gas/tests/test-private-ocr-status.cjs
      - run: node gas/tests/test-owner-ocr-evidence.cjs
      - run: node gas/tests/test-installed-private-version.cjs
      - run: node gas/tests/test-v020-stage-plan.cjs
      - run: node gas/tests/test-v020-isolated-stage.cjs
      - run: node gas/tests/test-v020-recovery-diagnostic.cjs
      - run: node gas/tests/test-v023-stage-plan.cjs
      - run: node gas/tests/test-v023-stage-inventory.cjs
      - run: node --check gas/scripts/plan-v023-isolated-stage.cjs
      - run: node --check gas/scripts/v023-stage-inventory.cjs
      - run: node --check gas/scripts/diagnose-v020-isolated-stage.cjs
      - run: node --check gas/scripts/create-v020-isolated-stage.cjs
      - run: node --check gas/scripts/plan-v020-private-stage.cjs
      - run: node --check gas/scripts/audit-installed-private-version.cjs
      - run: node --check gas/scripts/audit-owner-ocr-evidence.cjs
      - run: node gas/tests/test-private-browser-probe.cjs
      - run: node gas/tests/test-browser-runtime.cjs
      - run: node gas/tests/test-system-browser.cjs
      - run: node gas/tests/test-private-ocr-temporary-files.cjs
      - run: node --check gas/scripts/check-private-ocr-temporary-files.cjs
      - run: node --check gas/tests/test-real-browser.cjs
      - run: node --check gas/scripts/check-local-browser.cjs
      - run: node gas/tests/test-config-drift.cjs
      - run: node gas/tests/test-private-files.cjs
      - run: node gas/tests/test-clasp-files.cjs
      - run: node gas/tests/test-separate-tax.cjs
      - run: node gas/tests/test-google-recovery.cjs
      - run: node gas/tests/test-engine.cjs
      - run: node gas/tests/test-observed.cjs
      - run: node gas/tests/test-ocr.cjs
      - run: node gas/tests/test-contract.cjs
      - run: node gas/tests/test-browser.cjs
      - run: node gas/scripts/build-preview.cjs
      - run: node gas/tests/test-preview.cjs
      - run: npx --prefix gas playwright install --with-deps chromium
      - run: node gas/tests/test-browser-auth.cjs
      - run: node gas/tests/test-real-browser.cjs
      - run: node gas/tests/test-separate-ui.cjs
      - run: node gas/tests/test-responsive.cjs
      - run: node gas/tests/test-mobile-camera.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GAS-synthetic-Chromium-${{ github.run_id }}
          path: gas/dist/acceptance/
          if-no-files-found: warn
          retention-days: 14
  windows-self-hosted:
    # Trusted owner branch push only. Never run fork/PR code on this runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'tanaka456jp/Furusato_nouzei' &&
      github.ref == 'refs/heads/feature/gas-workflow-20261106' &&
      github.actor == 'tanaka456jp'
    runs-on: [self-hosted, Windows, furusato-excel]
    concurrency:
      group: furusato-excel-device
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix gas --ignore-scripts --no-audit --no-fund
      - name: PowerShell offline preflight (no OAuth or Google writes)
        shell: powershell
        run: ./gas/scripts/setup-private-gas.ps1
      - name: Isolated PDF text checker dependency
        run: python -m pip install --target gas/.qa-python pypdf==6.1.3
      - run: node gas/tests/test-deployment.cjs
      - run: node gas/tests/test-live-ocr-readiness.cjs
      - run: node gas/tests/test-private-ocr-status.cjs
      - run: node gas/tests/test-owner-ocr-evidence.cjs
      - run: node gas/tests/test-installed-private-version.cjs
      - run: node gas/tests/test-v020-stage-plan.cjs
      - run: node gas/tests/test-v020-isolated-stage.cjs
      - run: node gas/tests/test-v020-recovery-diagnostic.cjs
      - run: node gas/tests/test-v023-stage-plan.cjs
      - run: node gas/tests/test-v023-stage-inventory.cjs
      - run: node --check gas/scripts/plan-v023-isolated-stage.cjs
      - run: node --check gas/scripts/v023-stage-inventory.cjs
      - run: node --check gas/scripts/diagnose-v020-isolated-stage.cjs
      - run: node --check gas/scripts/create-v020-isolated-stage.cjs
      - run: node --check gas/scripts/plan-v020-private-stage.cjs
      - run: node --check gas/scripts/audit-installed-private-version.cjs
      - run: node --check gas/scripts/audit-owner-ocr-evidence.cjs
      - run: node gas/tests/test-private-browser-probe.cjs
      - run: node gas/tests/test-browser-runtime.cjs
      - run: node gas/tests/test-system-browser.cjs
      - run: node gas/tests/test-private-ocr-temporary-files.cjs
      - run: node --check gas/scripts/check-private-ocr-temporary-files.cjs
      - run: node --check gas/tests/test-real-browser.cjs
      - run: node --check gas/scripts/check-local-browser.cjs
      - run: node gas/tests/test-config-drift.cjs
      - run: node gas/tests/test-clasp-files.cjs
      - run: node gas/tests/test-separate-tax.cjs
      - run: node gas/tests/test-google-recovery.cjs
      - run: node gas/tests/test-engine.cjs
      - run: node gas/tests/test-observed.cjs
      - run: node gas/tests/test-ocr.cjs
      - run: node gas/tests/test-browser.cjs
      - run: node gas/scripts/build-preview.cjs
      - name: Installed Edge real browser synthetic workflow and PDF
        env:
          FURUSATO_BROWSER_CHANNEL: msedge
        run: |
          foreach ($test in @('test-browser-auth', 'test-real-browser', 'test-separate-ui', 'test-responsive', 'test-mobile-camera')) {
            node "gas/tests/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "Windows Edge regression failed ($test)" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GAS-Windows-device-synthetic-${{ github.run_id }}
          path: gas/dist/acceptance/
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnostic Excel COM state (single synthetic case)
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[excel-calc-diagnostic]')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/tanaka456jp/Furusato_nouzei/releases/download/v4.18.2/Furusato_nouzei_v4.18.2_ReadyToUse.zip'
          $expected = 'f534882f56461ea23a75474f24e68ad364d557091609c994341c179e9a655f25'
          $zip = Join-Path $env:RUNNER_TEMP ('FurusatoDiag_'+$env:GITHUB_RUN_ID+'.zip')
          $folder = Join-Path $env:GITHUB_WORKSPACE 'gas\dist\parity'
          [void][IO.Directory]::CreateDirectory($folder)
          $report = Join-Path $folder 'calculation-diagnostic.json'
          if ((Test-Path -LiteralPath $zip) -or (Test-Path -LiteralPath $report)) { throw 'Existing scratch file' }
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw 'Release ZIP checksum failure'
            }
            .\gas\parity\run-excel-oracle.ps1 -ReleaseZip $zip -OutputPath $report -DiagnosticOnly
            if (!(Test-Path -LiteralPath $report)) { throw 'Diagnostic report missing' }
            $diag = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if ($diag.release -cne 'HOLD' -or $diag.eligibleForParity -ne $false) {
              throw 'Diagnostic must never claim Excel parity'
            }
            ('EXCEL_DIAGNOSTIC: state='+$diag.calculationAfter+'; calculateMs='+$diag.calculateCallMilliseconds+
            '; release=HOLD') >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          }
      - uses: actions/upload-artifact@v4
        if: >-
          always() && github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[excel-calc-diagnostic]')
        with:
          name: Furusato-Excel-COM-diagnostic-${{ github.run_id }}
          path: gas/dist/parity/calculation-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare observed 41 synthetic Excel rows (global pending remains HOLD)
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[excel-observed-41]')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/tanaka456jp/Furusato_nouzei/releases/download/v4.18.2/Furusato_nouzei_v4.18.2_ReadyToUse.zip'
          $expected = 'f534882f56461ea23a75474f24e68ad364d557091609c994341c179e9a655f25'
          $zip = Join-Path $env:RUNNER_TEMP ('FurusatoObserved_'+$env:GITHUB_RUN_ID+'.zip')
          $folder = Join-Path $env:GITHUB_WORKSPACE 'gas\dist\parity'
          [void][IO.Directory]::CreateDirectory($folder)
          $oracle = Join-Path $folder 'oracle-observed.json'
          $diff = Join-Path $folder 'comparison-observed.json'
          if ((Test-Path $zip) -or (Test-Path $oracle) -or (Test-Path $diff)) { throw 'Existing scratch file' }
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw 'Official ZIP checksum mismatch'
            }
            .\gas\parity\run-excel-oracle.ps1 -ReleaseZip $zip -OutputPath $oracle -CompareObserved
            if (!(Test-Path $oracle)) { throw 'Missing observed Excel oracle' }
            node gas/parity/compare-observed.cjs $oracle | Out-File -LiteralPath $diff -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Observed comparisons invalid' }
            $report = Get-Content -LiteralPath $diff -Raw | ConvertFrom-Json
            if ($report.verdict -cne 'HOLD' -or $report.checked -ne 41) {
              throw 'Invalid observed comparison boundary'
            }
            ('EXCEL_GLOBAL_PENDING_OBSERVED: matched='+$report.matched+
               '/41; mismatch='+$report.mismatchCount+'; still HOLD') >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (Test-Path $zip) { Remove-Item $zip -Force }
          }
      - uses: actions/upload-artifact@v4
        if: >-
          always() && github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[excel-observed-41]')
        with:
          name: Furusato-Excel-observed-41-${{ github.run_id }}
          path: gas/dist/parity/*observed.json
          if-no-files-found: warn
          retention-days: 14
      - name: One-shot official Excel v4.18.2 parity (41 synthetic cases)
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[excel-parity-41]')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'https://github.com/tanaka456jp/Furusato_nouzei/releases/download/v4.18.2/Furusato_nouzei_v4.18.2_ReadyToUse.zip'
          $expected = 'f534882f56461ea23a75474f24e68ad364d557091609c994341c179e9a655f25'
          $download = Join-Path $env:RUNNER_TEMP ('FurusatoOfficial_'+$env:GITHUB_RUN_ID+'.zip')
          if (Test-Path -LiteralPath $download) { throw 'Scratch ZIP already exists' }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'gas\dist\parity'
          [void][System.IO.Directory]::CreateDirectory($dir)
          $report = Join-Path $dir 'synthetic-oracle.json'
          if (Test-Path -LiteralPath $report) { throw 'Oracle report already exists' }
          try {
            Invoke-WebRequest -Uri $source -OutFile $download -UseBasicParsing
            $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne $expected) { throw 'Official ZIP hash mismatch. Excel was not started.' }
            .\gas\parity\run-excel-oracle.ps1 -ReleaseZip $download -OutputPath $report
            'EXCEL_41_CASE_PARITY_RESULT: covered synthetic cases only; release HOLD.' >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (Test-Path -LiteralPath $download) { Remove-Item -LiteralPath $download -Force }
          }
      - uses: actions/upload-artifact@v4
        if: >-
          always() && github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[excel-parity-41]')
        with:
          name: Furusato-Excel-v4.18.2-parity-${{ github.run_id }}
          path: gas/dist/parity/synthetic-oracle.json
          if-no-files-found: warn
          retention-days: 14
      - name: Acceptance boundary
        shell: powershell
        run: |
          'Windows device browser: synthetic only. Google OAuth/deploy/OCR and physical printing require separate private evidence. Release HOLD.' >> $env:GITHUB_STEP_SUMMARY
