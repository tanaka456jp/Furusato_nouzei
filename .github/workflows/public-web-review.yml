name: Public web offline review (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'public-web/**'
      - 'gas/Engine.gs'
      - '.github/workflows/public-web-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-web:
    name: Static build and offline browser privacy acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local browser test dependency
        run: npm ci --prefix gas --ignore-scripts --no-audit --no-fund
      - name: Install pinned OCR build dependencies (review only)
        run: npm install --prefix public-web --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Syntax and privacy contract
        run: |
          node --check public-web/scripts/build.cjs
          node --check public-web/src/app.js
          node --check public-web/tests/test-public-web.cjs
          node --check public-web/tests/test-ocr-review.cjs
          node --check public-web/src/ocr-review.js
          node --check public-web/src/ocr.js
          node --check public-web/src/ocr-quality.js
          node --check public-web/src/ocr-layout.js
          node --check public-web/src/ocr-perspective.js
          node --check public-web/tests/test-ocr-perspective.cjs
          node --check public-web/src/ocr-regions.js
          node --check public-web/tests/test-ocr-regions.cjs
          node --check public-web/quality/score-private.cjs
          node --check public-web/tests/test-ocr-benchmark.cjs
          node --check public-web/tests/test-ocr-layout.cjs
          node --check public-web/tests/test-ocr-quality.cjs
          node --check public-web/tests/test-ocr-browser-smoke.cjs
          node --check public-web/tests/test-ocr-dom.cjs
      - name: Build private review site and run synthetic browser acceptance
        run: |
          node public-web/scripts/build.cjs
          node public-web/tests/test-ocr-review.cjs
          node public-web/tests/test-ocr-quality.cjs
          node public-web/tests/test-ocr-layout.cjs
          node public-web/tests/test-ocr-perspective.cjs
          node public-web/tests/test-ocr-regions.cjs
          node public-web/tests/test-ocr-benchmark.cjs
          node public-web/tests/test-public-web.cjs
          node public-web/tests/test-ocr-dom.cjs
      - name: Install isolated Chromium for on-device OCR WASM startup
        run: ./gas/node_modules/.bin/playwright install chromium
      - name: Real browser OCR startup smoke (synthetic canvas, no upload)
        run: node public-web/tests/test-ocr-browser-smoke.cjs
      - name: Confirm no deployment or ads
        run: |
          test -f public-web/dist/robots.txt
          grep -q 'Disallow: /' public-web/dist/robots.txt
          grep -q "connect-src 'self'" public-web/dist/_headers
          test -s public-web/dist/vendor/tesseract/lang/jpn.traineddata.gz
          test -s public-web/dist/vendor/pdf.worker.mjs
          if grep -R -E 'adsbygoogle|googlesyndication|googletagmanager' public-web/dist; then
            echo 'Unexpected advertising or analytics script detected'
            exit 1
          fi
      # The full Japanese OCR model and WASM assets are intentionally omitted
      # from review artifacts to preserve GitHub storage quota. The built
      # assets were validated in this job; package builds them locally.
      - name: Upload small NONDEPLOYABLE UI review only (no model/WASM)
        uses: actions/upload-artifact@v4
        with:
          name: Furusato_Public_Web_UI_ONLY_NOT_DEPLOYABLE_${{ github.run_id }}
          path: |
            public-web/dist/index.html
            public-web/dist/about.html
            public-web/dist/privacy.html
            public-web/dist/app.js
            public-web/dist/ocr.js
            public-web/dist/ocr-review.js
            public-web/dist/ocr-quality.js
            public-web/dist/ocr-layout.js
            public-web/dist/ocr-perspective.js
            public-web/dist/ocr-regions.js
            public-web/dist/engine.js
            public-web/dist/style.css
            public-web/dist/robots.txt
            public-web/dist/_headers
          if-no-files-found: error
          retention-days: 3
      - name: Release boundary
        run: |
          echo 'Local OCR review only. No source documents uploaded. NO Cloudflare deployment, NO ads, NO indexing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Supported tax cases still require independent real-device and legal acceptance. RELEASE=HOLD' >> "$GITHUB_STEP_SUMMARY"
